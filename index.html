html,body{margin:0;height:100%;background:#0f1b2a;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
#pano{position:fixed;inset:0}
.pnlm-load-box{background:rgba(10,20,34,.8)}

#ov.on path{opacity:1}
.eti{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
.eti.on{opacity:1}
.eti div{padding:10px 18px 9px;border-radius:12px;background:rgba(10,20,34,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.eti b{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:30px;line-height:1}
.eti small{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.eti i{display:block;width:1px;height:26px;margin:0 auto;background:linear-gradient(#fff,transparent)}
.txt{position:fixed;left:clamp(18px,3vw,44px);bottom:clamp(22px,5vh,46px);z-index:5;pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.txt small{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;opacity:.85}
.txt h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:clamp(38px,5vw,70px);margin:8px 0 0;line-height:1}
.sw{position:fixed;right:clamp(14px,3vw,44px);bottom:clamp(22px,5vh,46px);z-index:5;display:flex;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.2);border-radius:40px;background:rgba(10,20,34,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sw button{font:500 12.5px Inter,sans-serif;color:#fff;background:none;border:0;padding:10px 18px;border-radius:30px;cursor:pointer;opacity:.75;transition:all .3s}
.sw button.on{background:#fff;color:#111;opacity:1}
.marca{position:fixed;left:clamp(14px,2vw,22px);top:18px;z-index:5;padding:9px 18px;border:1px solid rgba(255,255,255,.2);border-radius:40px;background:rgba(10,20,34,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px}
.marca b{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;font-weight:400;margin-right:10px}
@media (max-width:700px){.sw{left:12px;right:12px;justify-content:center}.txt{bottom:96px}}

<div class="marca"><b>AIP</b><span>Conjunto · Vista aérea</span></div>
<div class="txt"><small>Aeropuerto Internacional del Pacífico</small><h1>Terminal y plataforma</h1></div>
<div class="sw"><button data-s="aereo" class="on">Vista aérea</button><button data-s="hall">TRB - Edificio Terminal</button></div>
<script>
const TRB=[[[-59.502, -20.435], [-63.369, -20.083], [-67.236, -19.292], [-67.632, -18.896], [-68.071, -17.578], [-69.697, -16.392], [-70.137, -15.864], [-71.191, -15.864], [-71.147, -15.293], [-69.741, -13.535], [-67.852, -11.821], [-66.621, -10.942], [-64.336, -9.712], [-62.139, -8.921], [-59.941, -8.481], [-56.338, -8.394], [-53.174, -9.009], [-51.24, -9.712], [-50.977, -9.976], [-49.395, -10.679], [-47.549, -11.909], [-46.494, -12.876], [-44.956, -14.502], [-44.429, -15.205], [-44.165, -15.908], [-44.121, -16.743], [-44.473, -16.743], [-45.264, -16.304], [-45.791, -16.216], [-51.943, -17.798], [-56.953, -18.765], [-57.656, -19.028], [-59.502, -20.435]], [[-80.684, -19.556], [-81.782, -19.512], [-82.661, -17.578], [-82.617, -17.271], [-82.266, -17.446], [-79.102, -17.358], [-78.135, -17.271], [-77.695, -17.007], [-76.245, -18.984], [-76.245, -19.16], [-76.553, -19.292], [-80.684, -19.556]], [[-72.861, -18.765], [-73.477, -18.765], [-74.048, -18.193], [-74.268, -17.271], [-71.631, -17.271], [-70.796, -18.018], [-70.796, -18.457], [-71.016, -18.589], [-72.861, -18.765]]];
const TIT={aereo:["Aeropuerto Internacional del Pacífico","Terminal y plataforma","Conjunto · Vista aérea"],hall:["TRB - Edificio Terminal · P00","Hall principal","TRB - Edificio Terminal"]};
const v=pannellum.viewer('pano',{default:{firstScene:'aereo',sceneFadeDuration:900,autoLoad:true,showControls:true,compass:false,hfov:100,minHfov:40,maxHfov:120,autoRotate:-1.2,autoRotateInactivityDelay:8000},
 scenes:{aereo:{type:'equirectangular',panorama:'aereo.jpg',yaw:-60,pitch:-15},hall:{type:'equirectangular',panorama:'hall.jpg',yaw:0,pitch:5}}});
const ir=s=>document.querySelector('.sw button[data-s="'+s+'"]').click();
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('on'))return;
  document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x===b));
  const s=b.dataset.s;document.querySelector('.txt small').textContent=TIT[s][0];document.querySelector('.txt h1').textContent=TIT[s][1];
  document.querySelector('.marca span').textContent=TIT[s][2];v.loadScene(s);
});
// resaltado del TRB: contorno proyectado sobre la vista en cada cuadro
const ov=document.getElementById('ov'),eti=document.getElementById('eti'),pano=document.getElementById('pano');
const R=Math.PI/180;let scr=[],hov=false,mx=-1,my=-1;
ov.innerHTML=TRB.map(()=>'<path/>').join('');const paths=[...ov.querySelectorAll('path')];
function proy(y,p,y0,p0,f,w,h){const dy=(y-y0)*R,pr=p*R,x=Math.cos(pr)*Math.sin(dy),yv=Math.sin(pr),z=Math.cos(pr)*Math.cos(dy);
 const yy=yv*Math.cos(p0*R)-z*Math.sin(p0*R),zz=yv*Math.sin(p0*R)+z*Math.cos(p0*R);if(zz<.05)return null;return[w/2+f*x/zz,h/2-f*yy/zz];}
function dentro(px,py,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!=(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c;}return c;}
function cuadro(){
 const enA=v.getScene&&v.getScene()==='aereo';scr=[];
 if(enA){const w=pano.clientWidth,h=pano.clientHeight,f=(w/2)/Math.tan(v.getHfov()*R/2),y0=v.getYaw(),p0=v.getPitch();
  TRB.forEach((pol,k)=>{const pts=pol.map(q=>proy(q[0],q[1],y0,p0,f,w,h));if(pts.some(q=>!q)){paths[k].setAttribute('d','');scr.push(null);return;}
   scr.push(pts);paths[k].setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z');});}
 hov=enA&&scr.some(p=>p&&dentro(mx,my,p));
 ov.classList.toggle('on',hov);eti.classList.toggle('on',hov);pano.style.cursor=hov?'pointer':'';
 if(scr[0]){let t=scr[0].reduce((a,q)=>q[1]<a[1]?q:a),cx=scr[0].reduce((a,q)=>a+q[0],0)/scr[0].length;eti.style.left=cx+'px';eti.style.top=(t[1]-4)+'px';}
 requestAnimationFrame(cuadro);}
requestAnimationFrame(cuadro);
pano.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
let dx0=0,dy0=0;
pano.addEventListener('pointerdown',e=>{dx0=e.clientX;dy0=e.clientY;mx=e.clientX;my=e.clientY;},true);
pano.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-dx0,e.clientY-dy0)<6&&v.getScene()==='aereo'&&scr.some(p=>p&&dentro(e.clientX,e.clientY,p)))ir('hall');},true);
pano.addEventListener('mouseleave',()=>{mx=my=-1;});
pano.addEventListener('touchstart',e=>{const t=e.touches[0];mx=t.clientX;my=t.clientY;},{passive:true});
